<!-- Evernote Tasks Page - Pixel Perfect Recreation -->
<div class="tasks-container">
  <!-- Header Section -->
  <div class="header-section">
    <!-- Title and Top Bar -->
    <div class="title-bar">
      <div class="flex-1">
        <h1 class="title">Tasks</h1>
        
        <!-- Tabs -->
        <div class="tabs-container">
          <button 
            (click)="setActiveTab('my-tasks')"
            [class.active]="activeTab === 'my-tasks'"
            class="tab-button">
            My tasks
          </button>
          <button 
            (click)="setActiveTab('notebooks')"
            [class.active]="activeTab === 'notebooks'"
            class="tab-button">
            Notebooks
          </button>
          <button 
            (click)="setActiveTab('notes')"
            [class.active]="activeTab === 'notes'"
            class="tab-button">
            Notes
          </button>
          <button 
            (click)="setActiveTab('today')"
            [class.active]="activeTab === 'today'"
            class="tab-button">
            Today
          </button>
          <button 
            (click)="setActiveTab('assigned')"
            [class.active]="activeTab === 'assigned'"
            class="tab-button">
            Assigned
          </button>
        </div>
      </div>

      <!-- Right Side Actions -->
      <div class="actions-bar">
        <button 
          (click)="openNewTaskModal()"
          class="new-task-button">
          + New Task
        </button>
        <button class="filter-button">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 6l4 4-4 4"></path>
          </svg>
        </button>
        <div class="search-container">
          <input 
            type="text" 
            placeholder="Find tasks…" 
            class="search-input">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Tasks Table -->
  <div class="tasks-table-container">
    <div class="overflow-x-auto">
      <table class="tasks-table">
        <thead>
          <tr class="table-header">
            <th class="table-header-cell">
              <input type="checkbox" class="task-checkbox">
            </th>
            <th class="table-header-cell">Title</th>
            <th class="table-header-cell">Due date</th>
            <th class="table-header-cell">Assigned note</th>
            <th class="table-header-cell">Assigned to</th>
          </tr>
        </thead>
        <tbody>
          @for (task of tasks; track task.id) {
            <tr class="table-row">
              <td class="table-cell">
                <input 
                  type="checkbox" 
                  [checked]="task.completed"
                  class="task-checkbox">
              </td>
              <td class="table-cell task-title">
                {{ task.title }}
              </td>
              <td class="table-cell" [class.overdue]="task.isOverdue">
                {{ task.dueDate }}
              </td>
              <td class="table-cell">
                <div class="flex items-center gap-2">
                  <svg class="task-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                  <span>{{ task.assignedNote }}</span>
                </div>
              </td>
              <td class="table-cell">
                {{ task.assignedTo }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  <!-- New Task Modal Component -->
  @if (isNewTaskModalOpen) {
    <vex-new-task-modal 
      (closed)="closeNewTaskModal()" 
      (created)="onCreateTask($event)">
    </vex-new-task-modal>
  }
</div>
