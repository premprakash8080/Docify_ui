<!-- Modal Overlay -->
<div (click)="onOverlayClick()" class="modal-overlay">
  <div (click)="onModalClick($event)" class="modal-container">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2 class="modal-title">New Task</h2>
    </div>

    <!-- Modal Content -->
    <form [formGroup]="taskForm" class="modal-content">
      <!-- Notebook Dropdown -->
      <!-- <div class="form-group">
        <label class="form-label">Notebook</label>
        <div class="select-icon-container">

          </select>

            ></path>
          </svg>
        </div>
      </div> -->

      <!-- Title Input -->
      <div class="form-group">
        <input
          type="text"
          formControlName="title"
          placeholder="Enter task"
          class="form-input"
        />
      </div>

      <!-- Description Textarea -->
      <div class="form-group">
        <textarea
          formControlName="description"
          placeholder="What is this task about?"
          rows="4"
          class="form-textarea"
        ></textarea>
      </div>

      <!-- Due Date Row -->
      <div class="form-group">
        <label class="form-label">Due date</label>
        <div class="button-group">
          <button
            type="button"
            (click)="setDueDate('today')"
            [class.active]="selectedDueDate === 'today'"
            class="option-button"
          >
            Today
          </button>
          <button
            type="button"
            (click)="setDueDate('tomorrow')"
            [class.active]="selectedDueDate === 'tomorrow'"
            class="option-button"
          >
            Tomorrow
          </button>
          <button
            type="button"
            (click)="setDueDate('custom')"
            [class.active]="selectedDueDate === 'custom'"
            class="option-button"
          >
            Custom
          </button>
          <button
            type="button"
            (click)="setDueDate('repeat')"
            [class.active]="selectedDueDate === 'repeat'"
            class="option-button"
          >
            Repeat
          </button>
        </div>
      </div>

      <!-- Reminder Row -->
      <div class="form-group">
        <label class="form-label">Reminder</label>
        <div class="button-group">
          <button
            type="button"
            (click)="setReminder('1hour')"
            [class.active]="selectedReminder === '1hour'"
            class="option-button"
          >
            In 1 hour
          </button>
          <button
            type="button"
            (click)="setReminder('4hours')"
            [class.active]="selectedReminder === '4hours'"
            class="option-button"
          >
            In 4 hours
          </button>
          <button
            type="button"
            (click)="setReminder('custom')"
            [class.active]="selectedReminder === 'custom'"
            class="option-button"
          >
            Custom
          </button>
        </div>
      </div>

      <!-- Assigned to Row -->
      <div class="form-group">
        <label class="form-label">Assigned to</label>
        <button type="button" class="link-button">Assign</button>
      </div>

      <!-- Priority Row -->
      <div class="form-group">
        <label class="form-label">Priority</label>
        <div class="button-group">
          <button
            type="button"
            (click)="setPriority('low')"
            [class.active]="selectedPriority === 'low'"
            class="option-button"
          >
            Low
          </button>
          <button
            type="button"
            (click)="setPriority('medium')"
            [class.active]="selectedPriority === 'medium'"
            class="option-button"
          >
            Medium
          </button>
          <button
            type="button"
            (click)="setPriority('high')"
            [class.active]="selectedPriority === 'high'"
            class="option-button"
          >
            High
          </button>
        </div>
      </div>

      <!-- Flag Row -->
      <div class="toggle-container">
        <label class="form-label">Flag</label>
        <button
          type="button"
          (click)="toggleFlag()"
          [class.active]="isFlagged"
          class="toggle-switch"
        >
          <span [class.active]="isFlagged" class="toggle-thumb"></span>
        </button>
      </div>
    </form>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button type="button" (click)="closeModal()" class="footer-button cancel">
        Cancel
      </button>
      <button
        type="button"
        (click)="createTask()"
        class="footer-button primary"
      >
        Create task
      </button>
    </div>
  </div>
</div>
