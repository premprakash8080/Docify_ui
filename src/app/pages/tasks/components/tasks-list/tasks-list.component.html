<div class="table-with-footer">
  <div class="table-wrapper all-job-table-wrapper show-gray-with-light-bg-scroll">
      <table [dataSource]="dataSource" class="w-full" mat-table matSort (matSortChange)="sortData($event)">
          <ng-container matColumnDef="checkbox">
              <th *matHeaderCellDef mat-header-cell>
                  <input type="checkbox" class="task-checkbox">
              </th>
              <td mat-cell *matCellDef="let row" mat-cell (click)="onTaskClick(row, $event)">
                  <div class="flex text-ellipsis">
                      <mat-checkbox 
                          [checked]="row.completed"
                          (change)="onTaskToggle(row, $event.checked)"
                          (click)="$event.stopPropagation()">
                      </mat-checkbox>
                  </div>
              </td>
          </ng-container>
          <ng-container matColumnDef="title">
              <th *matHeaderCellDef mat-header-cell mat-sort-header>Title</th>
              <td mat-cell *matCellDef="let row" mat-cell (click)="onTaskClick(row, $event)" [ngClass]="{'completed-text': row.completed}">
                  <div class="flex text-ellipsis">
                      <span [title]="row.title">{{row.title}}</span>
                  </div>
              </td>
          </ng-container>
          <ng-container matColumnDef="dueDate">
              <th *matHeaderCellDef mat-header-cell mat-sort-header>Due Date</th>
              <td mat-cell *matCellDef="let row" mat-cell (click)="onTaskClick(row, $event)" [ngClass]="{'overdue': row.isOverdue}">
                  <div>
                      {{row.dueDate || '-'}}
                  </div>
              </td>
          </ng-container>
          <ng-container matColumnDef="assignedNote">
              <th *matHeaderCellDef mat-header-cell mat-sort-header>Assigned Note</th>
              <td mat-cell *matCellDef="let row" mat-cell (click)="onTaskClick(row, $event)">
                  <div class="flex items-center gap-2">
                      <svg class="task-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                      </svg>
                      <span [title]="row.assignedNote">{{row.assignedNote}}</span>
                  </div>
              </td>
          </ng-container>
          <ng-container matColumnDef="assignedTo">
              <th *matHeaderCellDef mat-header-cell mat-sort-header>Assigned To</th>
              <td mat-cell *matCellDef="let row" mat-cell (click)="onTaskClick(row, $event)">
                  <div>
                      {{row.assignedTo || '-'}}
                  </div>
              </td>
          </ng-container>
          <ng-container matColumnDef="actions" stickyEnd>
              <th *matHeaderCellDef mat-header-cell mat-sort-header></th>
              <td *matCellDef="let row" class="w-10 text-secondary" mat-cell>
                  <div class="flex justify-end items-center table-action-button-wrapper">
                      <button (click)="onTaskDelete(row, $event)"
                          mat-flat-button class="table-horizon-icon delete-button" type="button">
                          <mat-icon svgIcon="mat:delete" class="mr-0"></mat-icon>
                      </button>
                  </div>
              </td>
          </ng-container>
          <tr *matHeaderRowDef="visibleColumns;sticky: true" mat-header-row></tr>
          <tr *matRowDef="let row; columns: visibleColumns; trackBy: trackByTaskId"
              [ngClass]="{'completed': row.completed, 'hover:bg-hover': true, 'trans-ease-out': true, 'cursor-pointer': true}" mat-row></tr>
      </table>
  </div>   

  <mat-paginator [length]="totalSize" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
  [pageIndex]="currentPage" (page)="handlePage($event)" aria-label="Select page of tasks"
  class="table-paginator sticky left-0">
</mat-paginator>
</div>
