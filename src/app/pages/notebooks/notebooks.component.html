<vex-page-layout mode="simple">
  <vex-page-layout-header>
    <div class="flex items-center justify-between w-full">
      <!-- Left: Title with count badge -->
      <div class="flex items-center gap-3">
        <h1 class="title m-0 text-3xl font-semibold">Notebooks</h1>
        <span class="bg-base text-hint rounded-full px-2 py-0.5 text-sm font-medium">
          {{ notebooks.length }}
        </span>
      </div>

      <!-- Right: Actions -->
      <div class="flex items-center gap-3">
        <!-- New Notebook Button -->
        <button 
          mat-raised-button 
          (click)="onCreateNotebook()"
          class="new-notebook-btn">
          <mat-icon svgIcon="mat:add"></mat-icon>
          New Notebook
        </button>

        <!-- Sort Icon -->
        <button 
          mat-icon-button 
          (click)="onSort('title')">
          <mat-icon svgIcon="mat:sort" [class.text-primary]="sortColumn === 'title'"></mat-icon>
        </button>

        <!-- View Toggle -->
        <button 
          mat-icon-button 
          (click)="toggleView()">
          <mat-icon [svgIcon]="viewMode === 'list' ? 'mat:grid_view' : 'mat:view_list'"></mat-icon>
        </button>

        <!-- Search -->
        <mat-form-field appearance="outline" class="w-64">
          <mat-label>Find Notebooks...</mat-label>
          <input matInput type="text">
          <mat-icon matPrefix svgIcon="mat:search"></mat-icon>
        </mat-form-field>
      </div>
    </div>
  </vex-page-layout-header>

  <vex-page-layout-content>
    <div class="card overflow-hidden">
      <table mat-table [dataSource]="notebooks" class="w-full">
        
        <!-- Title Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef class="uppercase text-secondary font-medium">
            <div class="flex items-center gap-2 cursor-pointer hover:text-primary" (click)="onSort('title')">
              <span>Title</span>
              @if (sortColumn === 'title') {
                <mat-icon class="icon-sm" [class.rotate-180]="sortDirection === 'desc'" svgIcon="mat:arrow_upward"></mat-icon>
              }
            </div>
          </th>
          <td mat-cell *matCellDef="let notebook" class="cursor-pointer hover:bg-hover">
            <div class="flex items-center gap-3 py-2" (click)="onNotebookClick(notebook)">
              <mat-icon class="text-secondary" svgIcon="mat:book"></mat-icon>
              <span class="font-medium">{{ notebook.title }}</span>
              <span class="bg-base text-hint rounded-full px-2 py-0.5 text-xs">
                {{ notebook.noteCount }}
              </span>
            </div>
          </td>
        </ng-container>

        <!-- Space Column -->
        <ng-container matColumnDef="space">
          <th mat-header-cell *matHeaderCellDef class="uppercase text-secondary font-medium">Space</th>
          <td mat-cell *matCellDef="let notebook" class="text-secondary">{{ notebook.space }}</td>
        </ng-container>

        <!-- Created By Column -->
        <ng-container matColumnDef="createdBy">
          <th mat-header-cell *matHeaderCellDef class="uppercase text-secondary font-medium">Created by</th>
          <td mat-cell *matCellDef="let notebook" class="text-secondary">{{ notebook.createdBy }}</td>
        </ng-container>

        <!-- Updated Column -->
        <ng-container matColumnDef="updated">
          <th mat-header-cell *matHeaderCellDef class="uppercase text-secondary font-medium">Updated</th>
          <td mat-cell *matCellDef="let notebook" class="text-secondary">{{ notebook.updated }}</td>
        </ng-container>

        <!-- Shared With Column -->
        <ng-container matColumnDef="sharedWith">
          <th mat-header-cell *matHeaderCellDef class="uppercase text-secondary font-medium">
            <div class="flex items-center justify-between w-full">
              <span>Shared with</span>
            </div>
          </th>
          <td mat-cell *matCellDef="let notebook" class="text-secondary">
            <div class="flex items-center justify-between">
              <span>{{ notebook.sharedWith }}</span>
              <button 
                mat-icon-button 
                [matMenuTriggerFor]="menu"
                (click)="onMenuClick($event)"
                class="!w-8 !h-8">
                <mat-icon class="icon-sm text-secondary" svgIcon="mat:more_vert"></mat-icon>
              </button>
              <mat-menu #menu="matMenu" xPosition="before">
                <button mat-menu-item>
                  <mat-icon svgIcon="mat:share"></mat-icon>
                  <span>Share</span>
                </button>
                <button mat-menu-item>
                  <mat-icon svgIcon="mat:edit"></mat-icon>
                  <span>Rename</span>
                </button>
                <button mat-menu-item>
                  <mat-icon svgIcon="mat:delete"></mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-hover transition-colors"></tr>
      </table>
    </div>
  </vex-page-layout-content>
</vex-page-layout>
