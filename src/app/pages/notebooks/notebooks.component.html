<vex-page-layout mode="simple">
  <vex-page-layout-header>
    <div class="flex items-center justify-between w-full">
      <!-- Left: Title with count badge -->
      <div class="flex items-center gap-3">
        <h1 class="title m-0 text-3xl font-semibold">Notebooks</h1>
        <span class="bg-base text-hint rounded-full px-2 py-0.5 text-sm font-medium">
          {{ totalNotebookCount }}
        </span>
      </div>

      <!-- Right: Actions -->
      <div class="flex items-center gap-3">
        <!-- New Notebook Button -->
        <button 
          mat-raised-button 
          (click)="onCreateNotebook()"
          class="new-notebook-btn">
          <mat-icon svgIcon="mat:add"></mat-icon>
          New Notebook
        </button>

        <!-- Sort Icon -->
        <button 
            mat-icon-button 
            [matMenuTriggerFor]="filterMenu"
            aria-label="Filter" 
            type="button">
            <mat-icon svgIcon="mat:filter_list"></mat-icon>
          </button>
          <mat-menu #filterMenu="matMenu" xPosition="before">
            <button mat-menu-item (click)="onFilterOptionClick('tag')">
              <mat-icon svgIcon="mat:label"></mat-icon>
              <span>By Tag</span>
            </button>
            <button mat-menu-item (click)="onFilterOptionClick('notebook')">
              <mat-icon svgIcon="mat:folder"></mat-icon>
              <span>Located In</span>
            </button>
            <button mat-menu-item (click)="onFilterOptionClick('created')">
              <mat-icon svgIcon="mat:schedule"></mat-icon>
              <span>Created Date</span>
            </button>
            <button mat-menu-item (click)="onFilterOptionClick('updated')">
              <mat-icon svgIcon="mat:update"></mat-icon>
              <span>Updated Date</span>
            </button>
          </mat-menu>

        <!-- View Toggle -->
        <button 
          mat-icon-button 
          (click)="toggleView()">
          <mat-icon [svgIcon]="viewMode === 'list' ? 'mat:grid_view' : 'mat:view_list'"></mat-icon>
        </button>

        <!-- Search -->
        <mat-form-field appearance="outline" class="w-64">
          <mat-label>Find Notebooks...</mat-label>
          <input matInput type="text" [formControl]="searchControl" placeholder="Search notebooks, stacks, notes...">
          <mat-icon matPrefix svgIcon="mat:search"></mat-icon>
          @if (searchControl.value) {
            <button mat-icon-button matSuffix (click)="searchControl.setValue('')" type="button" aria-label="Clear search">
              <mat-icon svgIcon="mat:close"></mat-icon>
            </button>
          }
        </mat-form-field>
      </div>
    </div>
  </vex-page-layout-header>

  <vex-page-layout-content>
    <div class="card overflow-hidden">
      @if (isLoading) {
        <div class="flex items-center justify-center p-8">
          <mat-icon class="animate-spin" svgIcon="mat:refresh"></mat-icon>
          <span class="ml-2">Loading notebooks...</span>
        </div>
      } @else if (error) {
        <div class="flex flex-col items-center justify-center p-8 text-center">
          <mat-icon class="text-error mb-2" svgIcon="mat:error_outline"></mat-icon>
          <p class="text-error mb-4">{{ error }}</p>
          <button mat-raised-button color="primary" (click)="loadData()">
            <mat-icon svgIcon="mat:refresh"></mat-icon>
            Retry
          </button>
        </div>
      } @else if (viewMode === 'list') {
        <vex-notebooks-list-view
          [flattenedRows]="flattenedRows"
          [sortColumn]="sortColumn"
          [sortDirection]="sortDirection"
          (sort)="onSort($event)"
          (chevronClick)="onChevronClick($event.event, $event.row)"
          (notebookChevronClick)="onNotebookChevronClick($event.event, $event.row)"
          (stackNameClick)="onStackNameClick($event.event, $event.row)"
          (notebookClick)="onNotebookClick($event)"
          (noteClick)="onNoteClick($event)"
          (rowKeydown)="onRowKeydown($event.event, $event.row)"
          (menuClick)="onMenuClick($event)">
        </vex-notebooks-list-view>
      } @else {
        <vex-notebooks-grid-view
          [notebooks]="filteredNotebooks.length > 0 ? filteredNotebooks : notebooks"
          (notebookClick)="onGridNotebookOrNoteClick($event)"
          (stackClick)="onGridStackClick($event)"
          (menuClick)="onGridMenuClick($event)">
        </vex-notebooks-grid-view>
      }
    </div>
  </vex-page-layout-content>
</vex-page-layout>
