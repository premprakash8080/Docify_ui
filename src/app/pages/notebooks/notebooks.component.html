<vex-page-layout mode="card">
  <vex-page-layout-header class="pb-16 flex flex-col items-start justify-center">
    <div [class.container]="layoutCtrl.value === 'boxed'" [class.px-gutter]="layoutCtrl.value === 'fullwidth'"
      class="w-full flex flex-col sm:flex-row justify-between">
      <div>
        <h1 class="title mt-0 mb-1">Notebooks</h1>
        <vex-breadcrumbs [crumbs]="['Apps', 'Notebooks']"></vex-breadcrumbs>
      </div>

      <div class="header-actions">
        <mat-button-toggle-group
          [formControl]="layoutCtrl"
          appearance="legacy"
          aria-label="Layout type"
          class="layout-toggle-group"
        >
          <mat-button-toggle value="boxed">
            <mat-icon svgIcon="mat:grid_view" class="mr-1"></mat-icon>
            Boxed
          </mat-button-toggle>
          <mat-button-toggle value="fullwidth">
            <mat-icon svgIcon="mat:crop_16_9" class="mr-1"></mat-icon>
            Full-Width
          </mat-button-toggle>
        </mat-button-toggle-group>
        
        <!-- View Toggle -->
        <button 
          mat-icon-button 
          (click)="toggleView()"
          matTooltip="{{ viewMode === 'list' ? 'Switch to Grid View' : 'Switch to List View' }}"
          class="ml-2">
          <mat-icon [svgIcon]="viewMode === 'list' ? 'mat:grid_view' : 'mat:view_list'"></mat-icon>
        </button>
      </div>
    </div>
  </vex-page-layout-header>

  <vex-page-layout-content [class.container]="layoutCtrl.value === 'boxed'"
    [class.px-gutter]="layoutCtrl.value === 'fullwidth'" class="-mt-6">
    <div class="card overflow-hidden -mt-16">
      @if (isLoading) {
        <div class="flex items-center justify-center p-8">
          <mat-icon class="animate-spin" svgIcon="mat:refresh"></mat-icon>
          <span class="ml-2">Loading notebooks...</span>
        </div>
      } @else if (error) {
        <div class="flex flex-col items-center justify-center p-8 text-center">
          <mat-icon class="text-error mb-2" svgIcon="mat:error_outline"></mat-icon>
          <p class="text-error mb-4">{{ error }}</p>
          <button mat-raised-button color="primary" (click)="this.getAllStacks()">
            <mat-icon svgIcon="mat:refresh"></mat-icon>
            Retry
          </button>
        </div>
      } @else if (viewMode === 'list') {
        <vex-notebooks-list-view
          [flattenedRows]="flattenedRows"
          [sortColumn]="sortColumn"
          [sortDirection]="sortDirection"
          [searchControl]="searchControl"
          (sort)="onSort($event)"
          (chevronClick)="onChevronClick($event.event, $event.row)"
          (notebookChevronClick)="onNotebookChevronClick($event.event, $event.row)"
          (stackNameClick)="onStackNameClick($event.event, $event.row)"
          (notebookClick)="onNotebookClick($event)"
          (noteClick)="onNoteClick($event)"
          (rowKeydown)="onRowKeydown($event.event, $event.row)"
          (menuClick)="onMenuClick($event)"
          (toggleStack)="onToggleStack($event)"
          (searchChange)="onSearchChange($event)"
          (filterClick)="onFilterOptionClick($event)"
          (addNotebook)="onCreateNotebook()">
        </vex-notebooks-list-view>
      } @else {
        <vex-notebooks-grid-view
          [notebooks]="filteredNotebooks.length > 0 ? filteredNotebooks : notebooks"
          [searchControl]="searchControl"
          (notebookClick)="onGridNotebookOrNoteClick($event)"
          (stackClick)="onGridStackClick($event)"
          (menuClick)="onGridMenuClick($event)"
          (searchChange)="onSearchChange($event)"
          (filterClick)="onFilterOptionClick($event)"
          (addNotebook)="onCreateNotebook()">
        </vex-notebooks-grid-view>
      }
    </div>
  </vex-page-layout-content>
</vex-page-layout>
