<div mat-dialog-title class="dialog-title">
  <h2 class="title-text">Create new notebook</h2>
  <button 
    type="button" 
    mat-icon-button 
    (click)="onCancel()" 
    class="close-button"
    aria-label="Close dialog">
    <mat-icon svgIcon="mat:close"></mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <p class="description-text">
    Notebooks are useful for grouping notes around a common topic. They can be private or shared.
  </p>

  <form [formGroup]="notebookForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notebook name</mat-label>
      <input 
        matInput 
        formControlName="name" 
        placeholder="Enter notebook name"
        autocomplete="off"
        autofocus>
      <mat-error *ngIf="notebookForm.get('name')?.hasError('required')">
        Notebook name is required
      </mat-error>
      <mat-error *ngIf="notebookForm.get('name')?.hasError('maxlength')">
        Notebook name must be less than 100 characters
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button 
    mat-button 
    type="button"
    (click)="onCancel()"
    class="cancel-button">
    Cancel
  </button>
  <button 
    mat-raised-button 
    color="primary" 
    type="button"
    [disabled]="!notebookForm.valid || isSubmitting"
    (click)="onSubmit()"
    class="create-button">
    <span *ngIf="!isSubmitting">Create</span>
    <span *ngIf="isSubmitting">Creating...</span>
  </button>
</mat-dialog-actions>
