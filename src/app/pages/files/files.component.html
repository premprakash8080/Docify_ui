<div class="files-page-container">
  <!-- Middle Panel: Files List -->
  <div class="files-list-panel">
    <vex-item-list-panel
      [title]="'Files'"
      [items]="(panelItems$ | async) || []"
      [selectedItemId]="selectedFileId"
      [searchControl]="searchControl"
      searchPlaceholder="Search files..."
      [config]="{ showCount: true, showActions: true, enableMeta: true }"
      (itemSelected)="onItemSelected($event)"
      (headerAction)="onHeaderAction($event)">
    </vex-item-list-panel>
  </div>

  <!-- Preview Panel: File Preview -->
  <div class="files-preview-panel">
    <vex-file-preview 
      [file]="selectedFile"
      (close)="onClosePreview()">
    </vex-file-preview>
  </div>
</div>
