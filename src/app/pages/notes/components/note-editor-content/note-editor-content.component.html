<div class="editor-content-wrapper">
  <!-- Evernote-style title input -->
  <input
    #titleInput
    type="text"
    class="note-title-input"
    [value]="title"
    (input)="onTitleInput($event)"
    (keydown.enter)="onTitleEnter($event)"
    (blur)="onTitleBlur()"
    placeholder="Title"
    maxlength="255"
    autocomplete="off"
    spellcheck="false"
    aria-label="Note title">
  
  <div class="tiptap-editor-container">
    <!-- Editor element - mounted explicitly via ViewChild in ngAfterViewInit -->
    <div #editorElement class="editor"></div>
  </div>
  
  <!-- Slash command menu - Top-level overlay positioned outside editor container -->
  <vex-slash-menu
    #slashMenu
    [visible]="slashMenuVisible"
    [position]="slashMenuPosition"
    [query]="slashMenuQuery"
    (select)="onSlashMenuSelect($event)"
    (close)="onSlashMenuClose()">
  </vex-slash-menu>
</div>
