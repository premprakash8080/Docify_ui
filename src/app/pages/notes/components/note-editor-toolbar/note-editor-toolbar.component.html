<!-- Evernote/Notion-style formatting toolbar -->
<div class="formatting-toolbar always-visible" [class.disabled]="!isEditorReady">
  <div class="toolbar-content">
    
    <!-- Typography Group -->
    <div class="toolbar-group">
      <button 
        mat-icon-button
        [matMenuTriggerFor]="fontFamilyMenu"
        #fontFamilyMenuTrigger="matMenuTrigger"
        (click)="saveSelection()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Font Family'"
        type="button"
        title="Font Family">
        <span class="font-family-display">{{ getCurrentFontFamily() || 'Aa' }}</span>
        <mat-icon svgIcon="mat:arrow_drop_down"></mat-icon>
      </button>
      <mat-menu #fontFamilyMenu="matMenu" (closed)="editor?.commands.focus()">
        <button 
          mat-menu-item 
          (click)="setFontFamily(''); fontFamilyMenuTrigger?.closeMenu()"
          [class.active]="getCurrentFontFamily() === ''">
          <span>Default</span>
        </button>
        <mat-divider></mat-divider>
        @for (font of fontFamilies; track font.value) {
          <button 
            mat-menu-item 
            (click)="setFontFamily(font.value); fontFamilyMenuTrigger?.closeMenu()"
            [class.active]="getCurrentFontFamily() === font.value">
            <span [style.font-family]="font.font">{{ font.label }}</span>
          </button>
        }
      </mat-menu>
      
      <button 
        mat-icon-button
        [matMenuTriggerFor]="fontSizeMenu"
        #fontSizeMenuTrigger="matMenuTrigger"
        (click)="saveSelection()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Font Size'"
        type="button"
        title="Font Size">
        <span class="font-size-display">{{ getCurrentFontSize() || '48' }}</span>
        <mat-icon svgIcon="mat:arrow_drop_down"></mat-icon>
      </button>
      <mat-menu #fontSizeMenu="matMenu" (closed)="editor?.commands.focus()">
        @for (size of fontSizes; track size.value) {
          <button 
            mat-menu-item 
            (click)="setFontSize(size.value); fontSizeMenuTrigger?.closeMenu()"
            [class.active]="getCurrentFontSize() === size.value">
            <span>{{ size.label }}</span>
          </button>
        }
      </mat-menu>
    </div>
    
    <div class="toolbar-divider"></div>
    
    <!-- Text Formatting Group -->
    <div class="toolbar-group">
      <button 
        mat-icon-button
        (click)="toggleBold()"
        [class.active]="isBoldActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Bold'"
        [attr.aria-pressed]="isBoldActive()"
        type="button"
        title="Bold (Ctrl+B)">
        <mat-icon svgIcon="mat:format_bold"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="toggleItalic()"
        [class.active]="isItalicActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Italic'"
        [attr.aria-pressed]="isItalicActive()"
        type="button"
        title="Italic (Ctrl+I)">
        <mat-icon svgIcon="mat:format_italic"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="toggleStrike()"
        [class.active]="isStrikeActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Strikethrough'"
        [attr.aria-pressed]="isStrikeActive()"
        type="button"
        title="Strikethrough">
        <mat-icon svgIcon="mat:strikethrough_s"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="toggleCode()"
        [class.active]="isCodeActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Inline Code'"
        [attr.aria-pressed]="isCodeActive()"
        type="button"
        title="Inline Code">
        <mat-icon svgIcon="mat:code"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        [matMenuTriggerFor]="colorMenu"
        #colorMenuTrigger="matMenuTrigger"
        (click)="saveSelection()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Text Color'"
        type="button"
        title="Text Color">
        <mat-icon svgIcon="mat:format_color_text"></mat-icon>
        <span class="color-indicator" [style.background-color]="getCurrentColor() || '#000000'"></span>
      </button>
      <mat-menu #colorMenu="matMenu" (closed)="editor?.commands.focus()">
        @for (color of colorPalette; track color.value) {
          <button 
            mat-menu-item 
            (click)="setColor(color.value); colorMenuTrigger?.closeMenu()"
            [class.active]="getCurrentColor() === color.value">
            <span class="color-preview" [style.background-color]="color.color"></span>
            <span>{{ color.label }}</span>
          </button>
        }
      </mat-menu>
      
      <button 
        mat-icon-button
        [matMenuTriggerFor]="highlightMenu"
        #highlightMenuTrigger="matMenuTrigger"
        (click)="saveSelection()"
        [class.active]="isHighlightActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Highlight'"
        [attr.aria-pressed]="isHighlightActive()"
        type="button"
        title="Highlight">
        <mat-icon svgIcon="mat:format_color_fill"></mat-icon>
        <span class="highlight-indicator" [style.background-color]="getCurrentHighlight() || 'transparent'"></span>
      </button>
      <mat-menu #highlightMenu="matMenu" (closed)="editor?.commands.focus()">
        @for (highlight of highlightPalette; track highlight.value) {
          <button 
            mat-menu-item 
            (click)="setHighlight(highlight.value); highlightMenuTrigger?.closeMenu()"
            [class.active]="getCurrentHighlight() === highlight.value">
            <span class="highlight-preview" [style.background-color]="highlight.color"></span>
            <span>{{ highlight.label }}</span>
          </button>
        }
      </mat-menu>
    </div>
    
    <div class="toolbar-divider"></div>
    
    <!-- Text / Paragraph Selector -->
    <div class="toolbar-group">
      <button 
        mat-icon-button
        [matMenuTriggerFor]="textMenu"
        [class.active]="isParagraphActive() || getCurrentHeadingLevel() !== null"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Text Style'"
        type="button"
        title="Text Style">
        <mat-icon svgIcon="mat:title"></mat-icon>
      </button>
      <mat-menu #textMenu="matMenu">
        <button 
          mat-menu-item 
          (click)="setParagraph()"
          [class.active]="isParagraphActive() && getCurrentHeadingLevel() === null">
          <span>Text</span>
        </button>
        <mat-divider></mat-divider>
        <button 
          mat-menu-item 
          (click)="setHeading(1)"
          [class.active]="isHeadingActive(1)">
          <span class="heading-option h1">Heading 1</span>
        </button>
        <button 
          mat-menu-item 
          (click)="setHeading(2)"
          [class.active]="isHeadingActive(2)">
          <span class="heading-option h2">Heading 2</span>
        </button>
        <button 
          mat-menu-item 
          (click)="setHeading(3)"
          [class.active]="isHeadingActive(3)">
          <span class="heading-option h3">Heading 3</span>
        </button>
      </mat-menu>
    </div>
    
    <div class="toolbar-divider"></div>
    
    <!-- Lists Group -->
    <div class="toolbar-group">
      <button 
        mat-icon-button
        (click)="toggleBulletList()"
        [class.active]="isBulletListActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Bullet List'"
        [attr.aria-pressed]="isBulletListActive()"
        type="button"
        title="Bullet List">
        <mat-icon svgIcon="mat:format_list_bulleted"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="toggleOrderedList()"
        [class.active]="isOrderedListActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Numbered List'"
        [attr.aria-pressed]="isOrderedListActive()"
        type="button"
        title="Numbered List">
        <mat-icon svgIcon="mat:format_list_numbered"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="toggleTaskList()"
        [class.active]="isTaskListActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Task List'"
        [attr.aria-pressed]="isTaskListActive()"
        type="button"
        title="Task List (Checklist)">
        <mat-icon svgIcon="mat:checklist"></mat-icon>
      </button>
    </div>
    
    <div class="toolbar-divider"></div>
    
    <!-- Block Elements Group -->
    <div class="toolbar-group">
      <button 
        mat-icon-button
        (click)="toggleBlockquote()"
        [class.active]="isBlockquoteActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Quote'"
        [attr.aria-pressed]="isBlockquoteActive()"
        type="button"
        title="Quote">
        <mat-icon svgIcon="mat:format_quote"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="toggleCodeBlock()"
        [class.active]="isCodeBlockActive()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Code Block'"
        [attr.aria-pressed]="isCodeBlockActive()"
        type="button"
        title="Code Block">
        <mat-icon svgIcon="mat:code"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        (click)="insertHorizontalRule()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Divider'"
        type="button"
        title="Divider (Horizontal Rule)">
        <mat-icon svgIcon="mat:horizontal_rule"></mat-icon>
      </button>
    </div>
    
    <div class="toolbar-divider"></div>
    
    <!-- Utility Group -->
    <div class="toolbar-group">
      <button 
        mat-icon-button
        (click)="clearFormatting()"
        [disabled]="!isEditorReady"
        [attr.aria-label]="'Clear Formatting'"
        type="button"
        title="Clear Formatting">
        <mat-icon svgIcon="mat:format_clear"></mat-icon>
      </button>
    </div>
    
  </div>
</div>
