<!-- Unified Top App Bar: Navigation LEFT, Actions RIGHT -->
<header class="unified-top-app-bar">
  <div class="app-bar-content">
    <!-- LEFT: Navigation -->
    <div class="app-bar-left">
      <!-- Navigation Controls (Previous/Next/Fullscreen) -->
      <button 
        mat-icon-button
        (click)="onHideNotesSidebar()"
        [attr.aria-label]="'Hide notes sidebar'"
        type="button"
        class="nav-button">
        <mat-icon svgIcon="mat:menu"></mat-icon>
      </button>
      
      <!-- <button 
        mat-icon-button
        (click)="onNext()"
        [attr.aria-label]="'Next note'"
        type="button"
        class="nav-button">
        <mat-icon svgIcon="mat:chevron_right"></mat-icon>
      </button> -->
      
      <button 
        mat-icon-button
        (click)="onFullscreen()"
        [attr.aria-label]="'Toggle fullscreen'"
        type="button"
        class="nav-button">
        <mat-icon svgIcon="mat:fullscreen"></mat-icon>
      </button>
      
      <!-- Breadcrumb (appears ONLY ONCE) -->
      <nav class="breadcrumb" *ngIf="note?.notebookId && notebookName" aria-label="Breadcrumb">
        <a class="breadcrumb-link" [routerLink]="['/notebooks', note.notebookId]">
          {{ notebookName }}
        </a>
        <mat-icon class="breadcrumb-separator" svgIcon="mat:chevron_right" aria-hidden="true"></mat-icon>
        <span class="breadcrumb-current">{{ note.title || 'Untitled' }}</span>
      </nav>
    </div>
    
    <!-- RIGHT: Actions -->
    <div class="app-bar-right">
      <!-- Save Status (subtle, low-contrast) -->
      <span class="save-status" *ngIf="isSaving" aria-live="polite">
        <mat-icon class="saving-icon spinning" svgIcon="mat:sync" aria-hidden="true"></mat-icon>
        <span class="sr-only">Saving</span>
      </span>
      <span class="save-status saved" *ngIf="!isSaving && lastSaved" aria-live="polite">
        Saved {{ getFormatLastSaved() }}
      </span>
      
      <!-- Action Buttons -->
      <button 
        mat-raised-button
        color="primary"
        (click)="onSave()"
        [attr.aria-label]="'Save note'"
        [disabled]="isSaving"
        type="button"
        class="save-button">
        <mat-icon svgIcon="mat:save"></mat-icon>
        <span>Save</span>
      </button>
      
      <button 
        mat-raised-button
        color="primary"
        (click)="onShare()"
        [attr.aria-label]="'Share note'"
        type="button"
        class="share-button">
        <mat-icon svgIcon="mat:share"></mat-icon>
        <span>Share</span>
      </button>
      
      <button 
        mat-icon-button
        (click)="onLink()"
        [attr.aria-label]="'Copy link'"
        type="button"
        class="action-button">
        <mat-icon svgIcon="mat:link"></mat-icon>
      </button>
      
      <button 
        mat-icon-button
        [matMenuTriggerFor]="moreMenu"
        [attr.aria-label]="'More options'"
        type="button"
        class="action-button">
        <mat-icon svgIcon="mat:more_vert"></mat-icon>
      </button>
      
      <mat-menu #moreMenu="matMenu">
        <!-- share button -->
        <button mat-menu-item (click)="onShare()">
          <mat-icon svgIcon="mat:share"></mat-icon>
          <span>Share</span>
        </button>
        <!-- copy link button -->
        <button mat-menu-item (click)="onLink()">
          <mat-icon svgIcon="mat:link"></mat-icon>
          <span>Copy link</span>
        </button>
        <!-- horizontal line top bottom spacing 8px-->
        <mat-divider style="margin: 8px 0;"></mat-divider>
        <!-- Duplicate button -->
        <button mat-menu-item (click)="onDuplicate()">
          <mat-icon svgIcon="mat:content_copy"></mat-icon>
          <span>Duplicate</span>
        </button>
        <!-- Pin button -->
        <button mat-menu-item (click)="onPin()">
          <mat-icon
            [svgIcon]="note?.pinned ? 'mat:push_pin' : 'mat:push_pin'">
          </mat-icon>
          <span>{{ note?.pinned ? 'Unpin' : 'Pin' }}</span>
        </button>
        <button mat-menu-item (click)="onArchive()">
          <mat-icon [svgIcon]="note?.archived ? 'mat:unarchive' : 'mat:archive'"></mat-icon>
          <span>{{ note?.archived ? 'Unarchive' : 'Archive' }}</span>
        </button>
        <button mat-menu-item (click)="onExport()">
          <mat-icon svgIcon="mat:download"></mat-icon>
          <span>Export</span>
        </button>
        <button mat-menu-item (click)="onManageTags()">
          <mat-icon svgIcon="mat:label"></mat-icon>
          <span>Tags</span>
        </button>
        <button mat-menu-item (click)="onMove()">
          <mat-icon svgIcon="mat:drive_file_move"></mat-icon>
          <span>Move</span>
        </button>
        <mat-divider style="margin: 8px 0;"></mat-divider>
        <!-- Find in note , note info , note history button -->
        <button mat-menu-item (click)="onFindInNote()">
          <mat-icon svgIcon="mat:search"></mat-icon>
          <span>Find in note</span>
        </button>
        <button mat-menu-item (click)="onNoteInfo()">
          <mat-icon svgIcon="mat:info"></mat-icon>
          <span>Note info</span>
        </button>
        <button mat-menu-item (click)="onNoteHistory()">
          <mat-icon svgIcon="mat:history"></mat-icon>
          <span>Note history</span>
        </button>

        <!-- horizontal line top bottom spacing 8px-->
        <mat-divider style="margin: 8px 0;"></mat-divider>

        <!-- print button -->
        <button mat-menu-item (click)="onPrint()">
          <mat-icon svgIcon="mat:print"></mat-icon>
          <span>Print</span>
        </button>


        <mat-divider style="margin: 8px 0;"></mat-divider>

        <button mat-menu-item (click)="onDelete()" class="delete-action">
          <mat-icon svgIcon="mat:delete"></mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </div>
  </div>
  
  <!-- Fixed Toolbar: Always visible in header at top position -->
  @if (editor) {
    <div class="editor-toolbar-container">
      <vex-note-editor-toolbar
        [editor]="editor"
        class="always-visible">
      </vex-note-editor-toolbar>
    </div>
  }
</header>
