<div class="notes-dashboard" [class.mobile]="isMobile">
  <!-- Two Column Layout (Desktop) -->
  @if (!isMobile) {
  <div class="dashboard-layout">
    <!-- Left Column: Notes List -->
    <div class="dashboard-center">
      <vex-notes-list
        [selectedNoteId]="selectedNoteId"
        [filterBy]="currentFilter"
        [notebookId]="selectedNotebookId"
        [tagId]="selectedTagId"
        [searchQuery]="searchQuery"
        [notes$]="filteredNotes$"
        (noteSelected)="onNoteSelected($event)">
      </vex-notes-list>
    </div>

    <!-- Right Column: Note Editor/Preview -->
    <div class="dashboard-right">
      @if ((selectedNote$ | async) === null) {
      <div class="editor-empty">
        <div class="empty-content">
          <mat-icon class="empty-icon" svgIcon="mat:note"></mat-icon>
          <h3 class="empty-title">Select a note to view</h3>
          <p class="empty-description">Choose a note from the list to start editing</p>
          <button mat-raised-button color="primary" (click)="onNewNote()">
            <mat-icon svgIcon="mat:add"></mat-icon>
            New Note
          </button>
        </div>
      </div>
      }
      
      @if (selectedNote$ | async; as selectedNote) {
      <div class="editor-content">
        <vex-note-page-content
          [note]="selectedNote"
          (previous)="onPreviousNote()"
          (next)="onNextNote()"
          (fullscreen)="toggleFullscreen()"
          (share)="onShare()"
          (link)="onCopyLink()"
          (pin)="onPin()"
          (archive)="onArchive()"
          (export)="onExport()"
          (manageTags)="onManageTags()"
          (duplicate)="onDuplicate()"
          (find)="onFind()"
          (info)="onInfo()"
          (history)="onHistory()"
          (print)="onPrint()"
          (delete)="onDelete()"
          (noteUpdated)="onNoteUpdated($event)">
        </vex-note-page-content>
      </div>
      }
    </div>
  </div>
  }

  <!-- Mobile Layout -->
  @if (isMobile) {
  <div class="mobile-layout">
    <vex-notes-list
      [selectedNoteId]="selectedNoteId"
      [filterBy]="currentFilter"
      [notebookId]="selectedNotebookId"
      [tagId]="selectedTagId"
      [searchQuery]="searchQuery"
      [notes$]="filteredNotes$"
      (noteSelected)="onNoteSelected($event)">
    </vex-notes-list>
  </div>
  }
</div>
