<vex-page-layout mode="simple">
  <!-- Page Layout Header (optional, can be hidden if not needed) -->
  <!-- <vex-page-layout-header>
    <h1>Notes</h1>
  </vex-page-layout-header> -->

  <!-- Page Layout Content -->
  <vex-page-layout-content>
    <!-- Notes Dashboard Container from Features Module -->
    <div class="notes-page-container">
      <!-- Embedded Notes Dashboard Component from Features Module -->
      <vex-notes-dashboard></vex-notes-dashboard>

      <!-- Cursor Layer for Collaborative Editing -->
      <!-- This layer will be used to render collaborator cursors above the editor -->
      <div class="cursor-layer"></div>
    </div>
  </vex-page-layout-content>
</vex-page-layout>
