<div class="notes-list-sidebar">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <h2 class="sidebar-title">
      Notes <span class="notes-count">{{ (filteredNotes$ | async)?.length || 0 }}</span>
    </h2>
    <div class="sidebar-actions">
      <button mat-icon-button aria-label="Filter" (click)="toggleFilter()">
        <mat-icon>tune</mat-icon>
      </button>
      <button mat-icon-button aria-label="More options" (click)="toggleMenu()">
        <mat-icon>more_horiz</mat-icon>
      </button>
    </div>
  </div>

  <!-- Notes List -->
  <div class="notes-list-content">
    <div 
      *ngFor="let note of filteredNotes$ | async; trackBy: trackByNoteId"
      class="note-list-item"
      [class.selected]="selectedNoteId === note.id"
      (click)="onNoteSelect(note.id)"
      [attr.role]="'button'"
      [attr.tabindex]="0"
      [attr.aria-label]="'Note: ' + (note.title || 'Untitled')">
      
      <div class="note-item-content">
        <div class="note-item-title">{{ (note.title || 'Untitled') | slice:0:10 }}{{ (note.title || 'Untitled').length > 10 ? '...' : '' }}</div>
        <div class="note-item-meta">
          <span class="note-item-time">{{ getRelativeTime(note.updatedAt) }}</span>
          <mat-icon 
            *ngIf="note.tasks && note.tasks.length > 0" 
            class="task-indicator"
            [attr.aria-label]="getCompletedTasksCount(note.tasks) + '/' + note.tasks.length + ' tasks completed'">
            checklist
          </mat-icon>
        </div>
        <div class="note-item-stats" *ngIf="note.tasks && note.tasks.length > 0">
          <span class="task-count">{{ getCompletedTasksCount(note.tasks) }}/{{ note.tasks.length }}</span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="(filteredNotes$ | async)?.length === 0" class="empty-state">
      <mat-icon class="empty-icon">note</mat-icon>
      <p class="empty-text">No notes found</p>
    </div>
  </div>
</div>
