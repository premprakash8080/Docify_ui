<div class="notes-sidebar">
  <!-- Search Input -->
  <div class="sidebar-search">
    <div class="search-input-container" (click)="openSearch()">
      <mat-icon class="search-icon" svgIcon="mat:search"></mat-icon>
      <input 
        type="text"
        class="search-input"
        placeholder="Quick Search"
        readonly
        [attr.aria-label]="'Search notes'">
      <div class="search-keybind">Ctrl K</div>
    </div>
  </div>

  <!-- New Note CTA -->
  <div class="new-note-section">
    <button 
      class="new-note-button"
      mat-raised-button
      color="primary"
      (click)="createNewNote()"
      type="button">
      <mat-icon svgIcon="mat:add"></mat-icon>
      <span>New Note</span>
    </button>
  </div>

  <!-- Navigation Items -->
  <div class="sidebar-navigation">
    <vex-sidenav-item *ngFor="let item of sidebarItems"
                      [item]="item"
                      [level]="0">
    </vex-sidenav-item>
  </div>

  <!-- Quick Filters -->
  <div class="quick-filters">
    <button 
      class="filter-button"
      (click)="filterSelected.emit('pinned')"
      [attr.aria-label]="'Show pinned notes'">
      <mat-icon svgIcon="mat:push_pin"></mat-icon>
      <span>Pinned</span>
    </button>
    <button 
      class="filter-button"
      (click)="filterSelected.emit('archived')"
      [attr.aria-label]="'Show archived notes'">
      <mat-icon svgIcon="mat:archive"></mat-icon>
      <span>Archived</span>
    </button>
    <button 
      class="filter-button"
      (click)="filterSelected.emit('trashed')"
      [attr.aria-label]="'Show trashed notes'">
      <mat-icon svgIcon="mat:delete"></mat-icon>
      <span>Trash</span>
    </button>
  </div>
</div>
