<div class="notes-toolbar">
  <div class="toolbar-left">
    <button 
      mat-raised-button
      color="primary"
      (click)="onCreateNewNote()"
      [attr.aria-label]="'Create new note'">
      <mat-icon svgIcon="mat:add"></mat-icon>
      <span>New Note</span>
    </button>

    <div class="search-container">
      <mat-icon class="search-icon" svgIcon="mat:search"></mat-icon>
      <input 
        type="text"
        class="search-input"
        placeholder="Search notes..."
        [(ngModel)]="searchQuery"
        (input)="onSearchChange(searchQuery)"
        [attr.aria-label]="'Search notes'">
    </div>
  </div>

  <div class="toolbar-right">
    <div class="view-toggle">
      <button 
        mat-icon-button
        [class.active]="currentView === 'list'"
        (click)="currentView = 'list'; viewToggle.emit('list')"
        [attr.aria-label]="'List view'"
        type="button">
        <mat-icon svgIcon="mat:view_list"></mat-icon>
      </button>
      <button 
        mat-icon-button
        [class.active]="currentView === 'grid'"
        (click)="currentView = 'grid'; viewToggle.emit('grid')"
        [attr.aria-label]="'Grid view'"
        type="button">
        <mat-icon svgIcon="mat:view_module"></mat-icon>
      </button>
    </div>

    <app-sync-status></app-sync-status>
  </div>
</div>
